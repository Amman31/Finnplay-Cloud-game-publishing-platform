entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

# Swarm provider reads labels on *services* (deploy.labels), required for Swarm stack routing.
providers:
  swarm:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

api:
  dashboard: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: ${TRAEFIK_ACME_EMAIL}
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

metrics:
  prometheus:
    entryPoint: web
