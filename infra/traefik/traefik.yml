entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

# Swarm provider reads labels on *services* (deploy.labels), required for Swarm stack routing.
providers:
  swarm:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

api:
  dashboard: true

certificatesResolvers:
  letsencrypt:
    acme:
      # Email is set in infra/swarm/stack.yml via CLI (--certificatesresolvers.letsencrypt.acme.email=…)
      # so Docker substitutes ${TRAEFIK_ACME_EMAIL} at deploy time. A literal ${…} in this mounted file
      # is often NOT expanded by Traefik, which breaks Let's Encrypt (invalidContact / unable to parse email).
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

metrics:
  prometheus:
    entryPoint: web
