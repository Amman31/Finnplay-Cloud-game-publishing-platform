# Traefik static config for local Docker Swarm (HTTP only, no ACME).
# Routers use entrypoint "web" (port 80). Use *.localhost hostnames (see docs/deployment-local.md).

entryPoints:
  web:
    address: ":80"

# Swarm provider reads labels on *services* (deploy.labels), required for stack.local.yml routing.
providers:
  swarm:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

api:
  dashboard: true

log:
  level: INFO

metrics:
  prometheus:
    entryPoint: web
