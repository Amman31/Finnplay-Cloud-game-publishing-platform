# Reverse proxy for Next.js in Docker Swarm (Traefik → nginx:80 → client:3000).
# Use a *literal* proxy_pass host (no variables). Variable + resolver 127.0.0.11 often fails to resolve
# `client` / `tasks.client` in Swarm and returns 502 "Host not found".
events {}

http {
  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://client:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
