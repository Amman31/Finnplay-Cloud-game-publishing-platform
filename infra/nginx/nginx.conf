events {}

http {
  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    listen 80;
    server_name _;

    location / {
      # Docker Swarm: VIP DNS name "client" often does not resolve from nginx's 127.0.0.11 lookups
      # when using a variable in proxy_pass. "tasks.client" is the documented task DNS name.
      set $client_upstream tasks.client:3000;
      proxy_pass http://$client_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
