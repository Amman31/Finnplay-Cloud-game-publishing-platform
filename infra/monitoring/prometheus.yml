global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:80"]

  - job_name: server
    metrics_path: /metrics
    static_configs:
      - targets: ["server:5000"]

  - job_name: python-service
    metrics_path: /metrics
    static_configs:
      - targets: ["python-service:8000"]
