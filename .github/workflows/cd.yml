name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_TAG: ${{ github.sha }}
      REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/finnplay-server:${{ env.IMAGE_TAG }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/finnplay-client:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.API_HOST }}/api

      - name: Build and push python-service image
        uses: docker/build-push-action@v6
        with:
          context: ./python-service
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}/finnplay-python-service:${{ env.IMAGE_TAG }}

      - name: Deploy stack on Swarm manager
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_MANAGER_HOST }}
          username: ${{ secrets.SWARM_MANAGER_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/finnplay
            git fetch origin main
            git reset --hard origin/main
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export REGISTRY_PREFIX=${{ env.REGISTRY_PREFIX }}
            if [ -n "${{ secrets.GHCR_PULL_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            fi
            if ! command -v node >/dev/null 2>&1; then
              echo "Install Node.js on the manager (see docs/deployment-azure.md), then re-run this workflow."
              exit 1
            fi
            node scripts/stack-deploy-production.cjs
